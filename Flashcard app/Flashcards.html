<style>
:root{--ink:#17241e;--muted:#708078;--paper:#f8f7f1;--card:#fff;--line:#dce5dd;--green:#2f6b55;--mint:#e5f0e6;--red:#d86e66;--yellow:#f2c75b;--purple:#9b83c7;--blue:#6b9fd1;--gray:#9aa49f;--black:#29332f;--shadow:0 18px 50px #27453618;--display:Georgia,serif;--body:"Trebuchet MS",Verdana,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body)}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:270px 1fr}aside{background:#edf4ee;border-right:1px solid var(--line);padding:27px 17px;display:flex;flex-direction:column;gap:25px}.brand{display:flex;align-items:center;gap:10px;padding:0 8px}.mark{width:35px;height:35px;border-radius:11px;background:var(--green);color:white;display:grid;place-items:center;font:22px var(--display)}.brand b{font:23px var(--display);font-weight:400}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase}.actions{display:grid;gap:8px}.btn{border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);padding:10px 13px;font-weight:700}.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}.primary{background:var(--green);color:white;border-color:var(--green)}.side-title{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:0 8px 9px;border-bottom:1px solid var(--line)}.side-title button{border:0;background:none;color:var(--green);font-size:18px}.tree{overflow:auto}.tree button{display:flex;align-items:center;gap:7px;width:100%;padding:8px;border:0;border-radius:8px;background:transparent;text-align:left}.tree button:hover,.tree button.active{background:#dcebdd}.tree .label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tree .count{color:var(--muted);font-size:11px}.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}.child{margin-left:16px;border-left:1px solid #cedbd0;padding-left:4px}.foot{margin-top:auto;color:var(--muted);font-size:11px;line-height:1.5;padding:8px}main{max-width:1250px;width:100%;margin:auto;padding:38px clamp(22px,5vw,70px) 70px}.top{display:flex;justify-content:space-between;gap:20px;margin-bottom:36px}.eyebrow{color:var(--green);font-size:11px;font-weight:bold;letter-spacing:.16em;text-transform:uppercase}h1,h2,h3,p{margin-top:0}h1{font:400 clamp(36px,5vw,61px)/.98 var(--display);letter-spacing:-.03em;margin:8px 0 13px}.intro{color:var(--muted);max-width:570px;line-height:1.6;margin:0}.icon{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:var(--card);color:var(--green);font-size:18px}.view{display:none}.view.active{display:block;animation:rise .25s ease}@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}.section-head{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:18px}.section-head h2{font:400 30px var(--display);margin:0}.section-head p{font-size:13px;color:var(--muted);margin:5px 0 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}.set{border:1px solid var(--line);background:white;border-radius:13px;padding:18px;min-height:172px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 3px 10px #304f3b08}.set:hover{box-shadow:var(--shadow);transform:translateY(-2px)}.set-top{display:flex;justify-content:space-between;gap:10px}.set h3{font:400 24px var(--display);margin:0 0 6px}.set p{color:var(--muted);font-size:13px;margin:0}.set-icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px}.set-foot{display:flex;justify-content:space-between;margin-top:20px}.set-foot button{border:0;background:none;color:var(--green);font-weight:bold;padding:0}.empty{border:1px dashed #bdcbbd;border-radius:14px;padding:50px 20px;text-align:center;color:var(--muted);grid-column:1/-1}.empty strong{display:block;font:24px var(--display);color:var(--ink);margin-bottom:8px}.editor{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}.panel,.study-card,.pile{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 10px #304f3b08}.panel{padding:23px}.editor-title{display:flex;justify-content:space-between;margin-bottom:20px}.editor-title h2{font:400 27px var(--display);margin:0}.muted{font-size:12px;color:var(--muted)}label{display:block;color:var(--muted);font-size:11px;letter-spacing:.11em;text-transform:uppercase;font-weight:bold;margin-bottom:7px}.field{margin-bottom:17px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;background:#fbfcf8;color:var(--ink);padding:11px 12px;outline:0}input:focus,textarea:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 3px #2f6b5520}textarea{min-height:92px;resize:vertical}.card-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;border-top:1px solid var(--line);padding:16px 0}.card-number{color:var(--green);font:20px var(--display);margin-bottom:9px}.row-actions{text-align:right;margin-top:8px}.danger{border:0;background:none;color:var(--red);font-size:12px}.panel h3{font:400 22px var(--display);margin:0 0 18px}.folder-list{max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px}.folder-choice{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:8px;border-radius:6px;font-size:13px}.folder-choice:hover,.folder-choice.selected{background:var(--mint)}.colors{display:flex;flex-wrap:wrap;gap:9px}.color{width:27px;height:27px;border-radius:50%;border:2px solid transparent}.color.selected{outline:2px solid var(--ink);outline-offset:3px}.hint{background:var(--mint);border-radius:9px;padding:13px;font-size:12px;line-height:1.5;color:#1f4c3c;margin-top:18px}.study-head{display:flex;justify-content:space-between;gap:15px;align-items:start;margin-bottom:22px}.study-head h2{font:400 34px var(--display);margin:0 0 5px}.study-card{max-width:780px;min-height:355px;margin:auto;padding:clamp(27px,6vw,65px);display:flex;flex-direction:column;justify-content:center;text-align:center}.card-label{color:var(--green);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:bold;margin-bottom:26px}.question{font:clamp(28px,4vw,46px)/1.12 var(--display);margin:0 auto 28px;max-width:620px}.answer{color:var(--muted);font-size:18px;line-height:1.5;border-top:1px solid var(--line);padding-top:23px;max-width:620px;margin:auto}.study-controls{display:flex;justify-content:center;gap:12px;margin:20px auto 35px}.study-controls .btn{min-width:165px;padding:13px 18px}.know{color:var(--green);border-color:#a4c4ad;background:#f0f8f0}.dont{color:#b9554c;border-color:#efc1ba;background:#fff4f1}.piles{display:grid;grid-template-columns:1fr 1fr;gap:15px;max-width:780px;margin:auto}.pile{padding:17px}.pile h3{font:400 21px var(--display);margin:0 0 13px}.pile.known{border-top:4px solid var(--green)}.pile.unknown{border-top:4px solid var(--red)}.pile ul{list-style:none;padding:0;margin:0;display:grid;gap:7px}.pile li{font-size:12px;padding:8px;background:var(--paper);border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.modal-backdrop{position:fixed;inset:0;background:#15251e66;display:none;place-items:center;padding:20px;z-index:5}.modal-backdrop.open{display:grid}.modal{width:min(430px,100%);background:white;border-radius:14px;padding:23px;box-shadow:var(--shadow)}.modal h2{font:400 26px var(--display);margin:0 0 20px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;right:22px;bottom:22px;background:var(--ink);color:white;padding:12px 15px;border-radius:9px;font-size:13px;opacity:0;transform:translateY(10px);transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:850px){.app{grid-template-columns:1fr}aside{padding:16px 18px;gap:15px}.brand{justify-content:center}.actions{display:flex}.actions .btn{flex:1}.tree{display:flex;gap:4px;overflow:auto}.tree .child{margin:0;border:0;padding:0}.tree button{white-space:nowrap}.foot{display:none}.editor{grid-template-columns:1fr}}@media(max-width:570px){.top,.section-head,.study-head{display:block}.top .icon,.toolbar{margin-top:16px}.card-row,.piles{grid-template-columns:1fr}.study-controls{flex-direction:column}.study-controls .btn{width:100%}}
</style>
<style>
:root{--ink:#e8f1ff;--muted:#8ea4bd;--paper:#0a1220;--card:#111e32;--line:#263b58;--green:#4d9dff;--mint:#172d4a;--red:#ff7d88;--yellow:#f3c85b;--purple:#a58cff;--blue:#62b4ff;--gray:#8293a8;--black:#050a12;--shadow:0 18px 50px #000b1f80;--display:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:var(--paper);color:var(--ink)}aside{background:#0d192a;border-color:var(--line)}.mark{background:var(--green);color:#06101f}.brand b{font-family:var(--body);font-weight:800}.brand small{color:var(--muted)}.btn{background:var(--card);border-color:var(--line);color:var(--ink)}.btn:hover{box-shadow:0 10px 25px #000b1f80}.primary{background:var(--green);border-color:var(--green);color:#06101f}.side-title{color:var(--muted);border-color:var(--line)}.side-title button{color:var(--blue)}.tree button{color:var(--ink)}.tree button:hover,.tree button.active{background:#17365a}.tree .count,.foot,.muted,.intro{color:var(--muted)}.eyebrow{color:var(--blue)}.icon{background:var(--card);border-color:var(--line);color:var(--blue)}.section-head h2,.editor-title h2,.panel h3,.study-head h2{font-family:var(--body);font-weight:800}.set,.panel,.study-card,.pile{background:var(--card);border-color:var(--line);box-shadow:0 3px 16px #000b1f55}.set h3{font-family:var(--body);font-weight:800}.set p{color:var(--muted)}.set-icon{background:#1b4d83!important;color:var(--blue)!important}.set-foot button{color:var(--blue)}.empty{border-color:#35547a;color:var(--muted)}.empty strong{font-family:var(--body);font-weight:800;color:var(--ink)}input,textarea,select{background:#0b1728;color:var(--ink);border-color:var(--line)}input::placeholder,textarea::placeholder{color:#647c98}.card-number{color:var(--blue);font-family:var(--body);font-weight:800}.folder-list{border-color:var(--line)}.folder-choice:hover,.folder-choice.selected{background:#17365a}.hint{background:var(--mint);color:#b9d9ff}.study-card .answer{border-color:var(--line);color:var(--muted)}.study-card{background:#101f35}.know{background:#122f4e;border-color:#367ac0;color:#7fc0ff}.dont{background:#3b202f;border-color:#a75067;color:#ff9da7}.pile li{background:#0b1728}.pile.known{border-top-color:var(--blue)}.pile.unknown{border-top-color:var(--red)}.modal-backdrop{background:#020814cc}.modal{background:var(--card)}.toast{background:#e8f1ff;color:#081322}
.brand small,.foot,.intro,.hint,.eyebrow,.section-head>div>p:not(#summary),.study-head .eyebrow{display:none}
</style>
<style>
.study-card:not(.revealed) .answer{display:none}
.study-card[role="button"]{cursor:pointer}

.editor{grid-template-columns:minmax(0,1fr)}
</style>

<body>
<div class="app"><aside><div class="brand"><div class="mark">F</div><div><b>Flashcards</b></div></div><div class="actions"><button class="btn primary" id="newSet">+ New set</button><button class="btn" id="newFolder">+ New folder</button></div><div><div class="side-title">Folders <span><button id="deleteFolder" title="Delete selected folder">🗑️</button> <button id="collapse">^</button></span></div><div class="tree" id="tree"></div></div><div class="foot"></div></aside>
<main><header class="top"><div><h1>Flashcards</h1></div><button type="button" class="icon" id="home" title="Home">&#x1F3E0;</button></header>
<section class="view active" id="homeView"><div class="section-head"><div><h2>Sets</h2><p id="summary"></p></div><div class="toolbar"><button class="btn" id="studyAll">Study everything</button></div></div><div class="grid" id="sets"></div></section>
<section class="view" id="editView"><div class="section-head"><div><h2 id="editTitle">New set</h2></div><div class="toolbar"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="saveSet">Save set</button></div></div><div class="editor"><div class="panel"><div class="editor-title"><h2>Cards</h2><span class="muted" id="count"></span></div><div class="field"><label for="setName">Set name</label><input id="setName" placeholder="Set name"></div><div id="cardFields"></div><button class="btn" id="addCard">+ Add card</button></div><div class="panel"><h3>Details</h3><div class="field"><label>Folder</label><div class="folder-list" id="folderChoices"></div></div><div class="field"><label>Color</label><div class="colors" id="setColors"></div></div></div></div></section>
<section class="view" id="studyView"><div class="study-head"><div><h2 id="studyTitle">Practice</h2><p id="studyMeta" class="intro"></p></div><button class="btn" id="endStudy">Quit</button></div><div class="study-card" id="studyCard"></div><div class="study-controls" id="controls"><button class="btn know" id="know">I know this</button><button class="btn dont" id="dont">I don't know this</button></div><div class="piles" id="piles" hidden><div class="pile known"><h3>Know <span class="muted" id="knownCount"></span></h3><ul id="knownList"></ul></div><div class="pile unknown"><h3>Don't know <span class="muted" id="unknownCount"></span></h3><ul id="unknownList"></ul></div></div></section></main></div>
<div class="modal-backdrop" id="modal"><form class="modal" id="folderForm"><h2>New folder</h2><div class="field"><label for="folderName">Folder name</label><input id="folderName" required placeholder="Folder name"></div><div class="field"><label>Color</label><div class="colors" id="folderColors"></div></div><div class="field"><label>Inside</label><select id="parent"></select></div><div class="modal-actions"><button type="button" class="btn" id="close">Cancel</button><button class="btn primary">Add folder</button></div></form></div><div class="toast" id="toast"></div>
<script>
(function(){
var colors={yellow:'#f2c75b',green:'#62a878',purple:'#9b83c7',red:'#d86e66',black:'#29332f',white:'#fff',gray:'#9aa49f',blue:'#6b9fd1'}, names=Object.keys(colors),key='flashcards-app',data=read(),state={folder:null,edit:null,color:'green',study:null,collapsed:false};
function read(){try{var d=JSON.parse(localStorage.getItem(key));if(d&&d.sets&&d.folders)return d}catch(e){}return{sets:[],folders:[]}}function save(){localStorage.setItem(key,JSON.stringify(data))}function id(p){return p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function dot(c){return'<span class="dot" style="background:'+colors[c]+';'+(c==='white'?'border:1px solid #c5cec6':'')+'"></span>'}function show(v){document.querySelectorAll('.view').forEach(function(x){x.classList.toggle('active',x.id===v+'View')});scrollTo(0,0)}function toast(s){var t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2200)}function descendants(x){var a=[x];data.folders.filter(function(f){return f.parentId===x}).forEach(function(f){a=a.concat(descendants(f.id))});return a}function fname(x){var f=data.folders.find(function(y){return y.id===x});return f?f.name:'No folder'}
function renderTree(){var t=document.getElementById('tree');t.innerHTML='';var all=document.createElement('button');all.className=state.folder===null?'active':'';all.innerHTML='&#x1F5C2;<span class="label">All cards</span><span class="count">'+data.sets.length+'</span>';all.onclick=function(){state.folder=null;render()};t.appendChild(all);function add(parent,level){data.folders.filter(function(f){return(f.parentId||null)===(parent||null)}).forEach(function(f){var b=document.createElement('button');b.style.paddingLeft=8+level*14+'px';b.innerHTML=dot(f.color)+'<span class="label">'+esc(f.name)+'</span><span class="count">'+data.sets.filter(function(s){return s.folderId===f.id}).length+'</span>';b.onclick=function(){state.folder=f.id;render()};t.appendChild(b);if(!state.collapsed)add(f.id,level+1)})}add(null,0)}function renderSets(){var g=document.getElementById('sets'),sets=data.sets.filter(function(s){return state.folder===null||descendants(state.folder).indexOf(s.folderId)>-1});document.getElementById('summary').textContent=sets.length+' set'+(sets.length===1?'':'s')+' &#x2728; '+sets.reduce(function(n,s){return n+s.cards.length},0)+' cards';g.innerHTML='';if(!sets.length){g.innerHTML='<div class="empty"><strong>No sets yet.</strong><br><br><button class="btn primary" id="first">New set</button></div>';document.getElementById('first').onclick=function(){openEdit()};return}sets.forEach(function(s){var a=document.createElement('article');a.className='set';a.innerHTML='<div class="set-top"><div><h3>'+esc(s.name)+'</h3><p>'+s.cards.length+' card'+(s.cards.length===1?'':'s')+' &#x2728; '+esc(fname(s.folderId))+'</p></div><div class="set-icon" style="background:'+colors[s.color]+'33;color:'+colors[s.color]+'">&#x1F0CF;</div></div><div class="set-foot"><button class="go">Start &#x27A1;</button><button class="edit">&#x270F;</button><button class="delete-set" data-set-id="'+s.id+'" title="Delete set">&#x1F5D1;</button></div>';a.querySelector('.go').onclick=function(){study(s.id)};a.querySelector('.edit').onclick=function(){openEdit(s.id)};g.appendChild(a)})}function render(){renderTree();renderSets()}
function colorPicker(target,chosen,cb){var el=document.getElementById(target);el.innerHTML='';names.forEach(function(n){var b=document.createElement('button');b.type='button';b.className='color'+(n===chosen?' selected':'');b.style.background=colors[n];b.title=n;b.onclick=function(){cb(n)};el.appendChild(b)})}
function openEdit(edit){state.edit=edit||null;var s=edit&&data.sets.find(function(x){return x.id===edit});state.color=s?s.color:'green';show('edit');document.getElementById('editTitle').textContent=s?'Edit set':'New set';document.getElementById('setName').value=s?s.name:'';drawCards(s?s.cards:[{front:'',back:''}]);drawDetails(s)}function drawCards(cards){var f=document.getElementById('cardFields');f.innerHTML='';cards.forEach(function(c,i){var r=document.createElement('div');r.className='card-row';r.innerHTML='<div><div class="card-number">'+String(i+1).padStart(2,'0')+' &#x2728; Front</div><textarea data-front placeholder="What do you want to recall?">'+esc(c.front)+'</textarea></div><div><div class="card-number">Back</div><textarea data-back placeholder="The answer or explanation">'+esc(c.back)+'</textarea><div class="row-actions"><button class="danger" data-remove>Remove card</button></div></div>';r.querySelector('[data-remove]').onclick=function(){r.remove();count()};f.appendChild(r)});count()}function count(){document.getElementById('count').textContent=document.querySelectorAll('.card-row').length+' cards'}function drawDetails(s){var f=document.getElementById('folderChoices');f.innerHTML='<button type="button" class="folder-choice" data-f="">'+dot('gray')+' No folder</button>'+data.folders.map(function(x){return'<button type="button" class="folder-choice" data-f="'+x.id+'">'+dot(x.color)+esc(x.name)+'</button>'}).join('');f.dataset.value=s?(s.folderId||''):'';f.querySelectorAll('[data-f]').forEach(function(b){if(b.dataset.f===f.dataset.value)b.classList.add('selected');b.onclick=function(){f.dataset.value=b.dataset.f;f.querySelectorAll('.folder-choice').forEach(function(x){x.classList.remove('selected')});b.classList.add('selected')}});colorPicker('setColors',state.color,function(c){state.color=c;colorPicker('setColors',c,arguments.callee)})}
function openFolder(){document.getElementById('modal').classList.add('open');document.getElementById('folderName').value='';document.getElementById('parent').innerHTML='<option value="">Top level</option>'+data.folders.map(function(f){return'<option value="'+f.id+'">'+esc(f.name)+'</option>'}).join('');state.color='green';colorPicker('folderColors','green',function(c){state.color=c;colorPicker('folderColors',c,arguments.callee)});document.getElementById('folderName').focus()}
function study(setId){var s=setId&&data.sets.find(function(x){return x.id===setId}),cards=s?s.cards.map(function(c){return{card:c,set:s.name}}):data.sets.flatMap(function(x){return x.cards.map(function(c){return{card:c,set:x.name}})});if(!cards.length){toast('Add cards first.');return}state.study={cards:cards,index:0,known:[],unknown:[]};show('study');drawStudy()}function drawStudy(){var x=state.study,done=x.known.length+x.unknown.length,c=x.cards[x.index],complete=done>=x.cards.length;document.getElementById('studyTitle').textContent=complete?'Done':'Your turn';document.getElementById('studyMeta').textContent=complete?'Piles are ready.':done+' of '+x.cards.length+' answered &#x2728; '+c.set;var card=document.getElementById('studyCard');card.innerHTML=complete?'<div class="card-label">Complete</div><div class="question">All sorted.</div>':'<div class="card-label">Prompt</div><div class="question">'+esc(c.card.front)+'</div><div class="answer">'+esc(c.card.back)+'</div>';document.getElementById('controls').style.display=complete?'none':'flex';document.getElementById('piles').hidden=!complete;document.getElementById('knownCount').textContent='('+x.known.length+')';document.getElementById('unknownCount').textContent='('+x.unknown.length+')';document.getElementById('knownList').innerHTML=x.known.map(function(q){return'<li>'+esc(q.card.front)+'</li>'}).join('')||'<li>Nothing here yet</li>';document.getElementById('unknownList').innerHTML=x.unknown.map(function(q){return'<li>'+esc(q.card.front)+'</li>'}).join('')||'<li>Nothing here yet</li>'}function answer(p){var x=state.study;if(x.index>=x.cards.length)return;x[p].push(x.cards[x.index++]);drawStudy()}
document.getElementById('newSet').onclick=function(){openEdit()};document.getElementById('newFolder').onclick=openFolder;document.getElementById('home').onclick=function(){show('home');render()};document.getElementById('cancel').onclick=function(){show('home')};document.getElementById('studyAll').onclick=function(){study()};document.getElementById('endStudy').onclick=function(){show('home')};document.getElementById('collapse').onclick=function(){state.collapsed=!state.collapsed;renderTree()};document.getElementById('addCard').onclick=function(){drawCards(Array.from(document.querySelectorAll('.card-row')).map(function(r){return{front:r.querySelector('[data-front]').value,back:r.querySelector('[data-back]').value}}).concat([{front:'',back:''}]))};document.getElementById('saveSet').onclick=function(){var name=document.getElementById('setName').value.trim(),cards=[];document.querySelectorAll('.card-row').forEach(function(r){var front=r.querySelector('[data-front]').value.trim(),back=r.querySelector('[data-back]').value.trim();if(front||back)cards.push({id:id('card'),front:front,back:back})});if(!name||!cards.length){toast('Add a set name and at least one card.');return}var s=state.edit&&data.sets.find(function(x){return x.id===state.edit});if(s){s.name=name;s.cards=cards;s.folderId=document.getElementById('folderChoices').dataset.value||null;s.color=state.color}else data.sets.push({id:id('set'),name:name,cards:cards,folderId:document.getElementById('folderChoices').dataset.value||null,color:state.color});save();render();show('home');toast('Saved!')};document.getElementById('know').onclick=function(){answer('known')};document.getElementById('dont').onclick=function(){answer('unknown')};document.getElementById('close').onclick=function(){document.getElementById('modal').classList.remove('open')};document.getElementById('folderForm').onsubmit=function(e){e.preventDefault();data.folders.push({id:id('folder'),name:document.getElementById('folderName').value.trim(),color:state.color,parentId:document.getElementById('parent').value||null});save();document.getElementById('modal').classList.remove('open');render();toast('Folder created.')};document.getElementById('deleteFolder').onclick=function(){if(state.folder===null){toast('Pick a folder first.');return}var folder=data.folders.find(function(item){return item.id===state.folder});if(!folder||!window.confirm('Delete the folder "'+folder.name+'"? Cards will be kept.'))return;data.sets.forEach(function(set){if(set.folderId===folder.id)set.folderId=folder.parentId||null});data.folders.forEach(function(item){if(item.parentId===folder.id)item.parentId=folder.parentId||null});data.folders=data.folders.filter(function(item){return item.id!==folder.id});state.folder=null;save();render();toast('Folder deleted.')};render();
})();
</script>
<script>
(function () {
  document.addEventListener('click', function (event) {
    var button = event.target.closest('.delete-set');
    if (!button) return;
    var setId = button.getAttribute('data-set-id');
    var stored = JSON.parse(localStorage.getItem('flashcards-app') || '{"sets":[],"folders":[]}');
    var set = stored.sets.find(function (item) { return item.id === setId; });
    if (!set || !window.confirm('Delete the set "' + set.name + '"?')) return;
    stored.sets = stored.sets.filter(function (item) { return item.id !== setId; });
    localStorage.setItem('flashcards-app', JSON.stringify(stored));
    window.location.reload();
  });
}());
</script>
<script>
(function () {
  var card = document.getElementById('studyCard');

  function syncCardState() {
    card.classList.remove('revealed');
    if (card.querySelector('.answer')) {
      card.setAttribute('role', 'button');
      card.setAttribute('tabindex', '0');
      card.setAttribute('aria-label', 'Flashcard prompt. Activate to reveal definition.');
    } else {
      card.removeAttribute('role');
      card.removeAttribute('tabindex');
      card.removeAttribute('aria-label');
    }
  }

  card.addEventListener('click', function () {
    if (card.querySelector('.answer')) card.classList.toggle('revealed');
  });
  card.addEventListener('keydown', function (event) {
    if ((event.key === 'Enter' || event.key === ' ') && card.querySelector('.answer')) {
      event.preventDefault();
      card.classList.toggle('revealed');
    }
  });
  new MutationObserver(syncCardState).observe(card, { childList: true });
  syncCardState();
}());
</script></body>
</html>
